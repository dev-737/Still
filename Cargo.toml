[package]
name = "still"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
cairo-rs = { version = "0.21", features = ["png"] }
pangocairo = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"
